<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO-WHILE LOOP (COLORFUL)</title>
    <style>
        body { background: #fce4ec;
             text-align: center; 
            font-family: Arial; }
   .box { 
    background: white;
        padding: 20px; 
        margin: 50px auto; 
       width: 300px; 
       border-radius: 10px;
}

h2 { color: #d81b60; }
    </style>
</head>
<body>
    <div class="box">
        <h2>DO-WHILE LOOP (COLORFUL)</h2>
        <script>
            let j=1;
     
            do
            {
                document.write("<span style='color:purple;'>"+j+"</span <br>")
                    j++;
            }while(j<=3);

        </script>
    </div>
</body>
</html>
