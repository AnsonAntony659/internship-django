<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECT ITERATION (COLORFUL)</title>
    <style>
        body
        {
            background: #f3e5f5;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .box
        {
            background: white;
            padding: 20px;
            margin: 50px  auto;
            width: 300px;
            border-radius: 10px;

        }
        h2
        {
            color: #6a1b9a;

        }

    </style>
</head>
<body>
    <div class="box">
        <h2>OBJECT ITERATION (COLORFUL)</h2>
        <script>
            let Person={name:"Arun",city:"Kottayam"};
            for(let key in Person)
        {
            document.write("<div style='color:blue;'>" + key + ": " + Person[key] + "</div>");

        }
        </script>
    </div>
</body>
</html>
