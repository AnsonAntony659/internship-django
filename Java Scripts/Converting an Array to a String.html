<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converting an Array to a String</title>
</head>
<body>
    <h1>Java Script Arrays</h1>
    <h2>the to sting method</h2>
    <p>The toString() method returns the elements of an array as a comma separated string:</p>
    <p id="demo"></p>
    <script>
        const fruits=["Banana","Orange","Apple","Mango"];
        let mylist=fruits.toString();
        document.getElementById("demo").innerHTML=mylist;
    </script>
</body>
</html>
