<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ARRAY ITERATION (COLORFUL)</title>
    <style>

        body { background: #fff0f5; 
            text-align: center;
             font-family: Arial; }
      
        .box { background: white; 
     padding: 20px; 
     margin: 50px auto;
     width: 300px;
     border-radius: 10px;
    }
 h2 { color: #ff1493; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Array Iteration </h2>
        <script>
            let marks=[80,90,70];
            marks.forEach(Function(marks))
            {
                document.write("<div style='color:green;'>Mark: "+ marks + "</div>");

            }
        </script>
    </div>
</body>
</html>
