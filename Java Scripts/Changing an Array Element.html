<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing an Array Element</title>
</head>
<body>
    <h1>Java Script Arrays</h1>
    <h2> bracket Indexing</h2>
    <p>Java Script Array Elements are accesed using numeric indexes (Starting from 0)</p>
    <p id="demo"></p>
    <script>
        const cars=["saab","volvo", "Bmw"];
        cars[0]="oodi";
        document.getElementById("demo").innerHTML=cars;
    </script>
</body>
</html>
