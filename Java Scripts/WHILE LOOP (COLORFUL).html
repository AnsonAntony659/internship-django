<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHILE LOOP (COLORFUL)</title>
    <style>
        body
        {
            background: #e0f7fa;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;

        }
    </style>
</head>
<body>
    <div class="box">
        <h2>WHILE LOOP (COLORFUL)</h2>
    <script>
        let i=1;
        while(i<=3)
    {
        document.write("<span style='color:red;'>"+i+"</span> <br>");
        i++;
    }
    </script>
    </div>
    
</body>
</html>
