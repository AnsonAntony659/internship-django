<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
    <style>
            body
     { 
        background: #fff3cd; text-align: center; font-family: Arial;
     }
.box { background: white; padding: 20px; margin: 50px auto; width: 300px; border-radius: 10px;
}
h2 { color: #ff8800; }
    </style>
</head>
<body>
    <div class="box">
<h2>Switch Example</h2>
<script>
let day = 2;
switch(day) {
case 1:
document.write("<b>Monday</b>");
break;
case 2:
document.write("<b style='color:green;'>Tuesday</b>");
break;
default:
document.write("<b>Invalid day</b>");
}
</script>
</div>
</body>
</html>
