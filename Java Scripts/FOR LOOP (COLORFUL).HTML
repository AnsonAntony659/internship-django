<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR LOOP (COLORFUL)</title>
    <style>
        body
        {
            background: #e6ffe6;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>
</head>
<body>
    <div class="box">
        <h2>For LOOP</h2>
    <script>
        for(let i=1;i<=5;i++)
    {
        document.write("<span style='color:blue;'>"+ i +"</span> <br>")
    }
    </script>
    </div>
</body>
</html>
