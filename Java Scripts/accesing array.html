<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessing Array </title>
</head>
<body>
    <h1>Java Script Array</h1>
    <h2>Bracket Index</h2>
    <p>Java Script Elements are accesed using numeric indexes (Starting from 0)</p>
    <p id="demo"></p>
    <script>
        const cars=["saab","volvo","Bmw"];
        document.getElementById("demo").innerHTML=cars[0];
    </script>
</body>
</html>
