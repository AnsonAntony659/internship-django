<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Types With Example </title>
</head>
<body>
    <head>Data Types Example</head>
    <script>
        let name="Arun";
        let Age="25"
        let isStudent="true"
        let marks=[80,90];
        let person={city:"Kottayam"}

        document.write("<b>Data Types</b> <br>");
        document.write("Type Of Name"+ typeof name +"<br>");
        document.write("Type Of Age"+ typeof Age + "<br>");
        document.write("Type Of IsStudent"+ typeof isStudent + "<br>");
        document.write("TYpe Of Marks" + typeof marks + "<br>" );
        document.write("Type Of Person" + typeof person + "<br>");



let a = 10;
let b = 5;
document.write("<br><b>Calculations:</b><br>");
// Arithmetic Opertars
document.write("Addition: " + (a + b) + "<br>");
document.write("Subtraction: " + (a - b) + "<br>");
document.write("Multiplication: " + (a * b) + "<br>");
document.write("Division: " + (a / b) + "<br>");
document.write("Modulus: " + (a % b) + "<br>");

//comaparison

document.write("<br><b>Comparison</b><br>");
document.write(" a > b :"+( a > b )+"<br>");
document.write(" a < b :"+( a < b )+"<br>");
document.write(" a == b :"+( a == b )+"<br>");


//Logical
document.write("<br><b>Logical</b><br>");
document.write("(a > 5 && b < 10): " + (a > 5 && b < 10) + "<br>");
document.write("(a < 5 || b < 10): " + (a < 5 || b < 10) + "<br>");


    </script>
</body>
</html>
