<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCOUNT REGISTERATION</title>
</head>
<body bgcolor="red">
    <center>
        <marquee behavior="" direction="left to right"> <h2>Account Register for Internship partcipation at GOOGLE</h2></marquee>
    </center>
    <form action="">
<!-- Personal Information about the user -->
        <fieldset>
            <legend>Personal Info</legend>
         <p>FirstName
            <input type="text" name="FirstName" size="30" maxlength="25" placeholder="FirstName"></p>
             <p>LastName 
            <input type="text" name="LastName" size="30" maxlength="25" placeholder="LastName"></p>

            <p>Password
                <input type="password" name="password" placeholder="enter the password here"></p>
                 <p>Confirm Password
                <input type="password" name="password" placeholder="enter the password here again"></p>
        </fieldset>
<!-- Sex Of The user -->
<fieldset>
    <legend>SEX </legend>
<p>Age
    <input type="number" name="Age" size="30" maxlength="25"></p>
    <br>Sex:&nbsp;&nbsp;&nbsp;
    <input type="radio" name="Sex" value="male">Male
    <input type="radio" name="Sex" value="Female">Female
    <input type="radio" name="Sex" value="Others">Others
    <br>
    <br>
    <br>
    <legend>Natioanlality</legend>
    <br>
    <select name="Natioanlality" size="1">
         <option value="select" selected> select</option>
        <option value="British"> British</option>
        <option value="Srilankan">Srilankan</option>
        <option value="German"> German</option>
        <option value="Indian"> Indian</option>
     </select>
        </p> 
</fieldset>
<!-- contact details of user -->
<fieldset>
    <legend>Contact Details</legend>
    <p>Phone No:
    <input type="number" name="phone"></p>
    <p>Address:</p>
    <textarea name="address" rows="4" cols="40"></textarea>
    <p>Email</p>
    <textarea name="Email" id="Email"></textarea>
</fieldset>
<fieldset>
<legend>Submit Section</legend>
<input type="submit" value="submit">
<input type="reset" value="reset">
<button><a href="Login Page.html">Home</a></button>
</fieldset>
</form> 
</body>
</html>
