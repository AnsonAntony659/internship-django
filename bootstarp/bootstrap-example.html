<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstarp </title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- text align color -->
    <h1 class="text-primary">Hello Bootstarp</h1> 
    <h1 class="text-success">Hello Bootstarp</h1>
     <h1 class="text-danger">Hello Bootstarp</h1> 
    <h1 class="text-warning">Hello Bootstarp</h1>
     <h1 class="text-center">Hello Bootstarp</h1> 
    <h1 class="text-end">Hello Bootstarp</h1>  


    <!-- form -->
    <form>
        <label>Name</label>
        <input type="text" class="form-control">
        <br>
        <label>Email</label>
        <input type="text" class="form-control">
        <br>
        <select class="form-select">
            <option>Kerala</option>
            <option>Tamil Nadu</option>
            <option>Karnataka</option>
        </select>
      

    </form>

       <!-- Column -->
         <div class="container">
            <div class="row">
                <div class="col-6">Left Side</div>
                <div class="col-6">Right Side</div>
            </div>
        </div>

        <div class="row">
            <div class="col-4">
                Column 1
            </div>
              <div class="col-4">
                Column 2
            </div>
              <div class="col-4">
                Column 3
            </div>

        </div>

        <!-- product card -->
        <div class="card" style="width: 300px;">
            <button class="btn btn-primary">Save</button>
               <button class="btn btn-success">Submit</button>
        <button class="btn btn-danger">Edit</button>
        <button class="btn btn-warning">Delete</button>
        </div>


        <!-- Column -->
         <div class="row">
            <div class="col-4">
                Column 1
            </div>
              <div class="col-4">
                Column 2
            </div>
              <div class="col-4">
                Column 3
            </div>

        </div>

        <!-- product Items -->

        <div class="class-body">
            <h4 class="card-title">Student</h4>
            <p class="card-text">BCA Student</p>
        </div>

        <div class="card" style="width: 250px;">
            <img src="mobile.jpg" alt="mobile" 
            class="card-img-top">
            <div class="card-body">
                <h5>Oppo A38</h5>
                <p>18000</p>
                <button class="btn btn-primary">Buy Now</button>
            </div>
        </div>


        <!-- Home Icons -->
         <i class="bi bi-house"></i>
    <i class="bi bi-person"></i>
    <i class="bi bi-cart"></i>
    <i class="bi bi-search"></i>
    <i class="bi bi-phone"></i>
    <i class="bi bi-envelope"></i>

    <!-- button -->
      <button class="btn btn-primary">Submit</button>
        <button class="btn btn-success">Submit</button>
        <button class="btn btn-danger">Edit</button>
        <button class="btn btn-warning">Delete</button>
        <button class="btn btn-dark">Delete</button>

</body>
</html>
